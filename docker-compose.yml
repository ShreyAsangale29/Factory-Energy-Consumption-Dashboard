version: '3.8'

services:
  factory-energy-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factory-energy-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  nginx-proxy:
    image: nginx:alpine
    container_name: factory-energy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - factory-energy-app
    restart: always
