# Application Server Config
server.port=8080
spring.application.name=factory-energy-dashboard

# H2 Database Settings
spring.datasource.url=jdbc:h2:mem:energydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Auto DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Static Web Resources Configuration
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:frontend/